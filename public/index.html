<style>
/* Layout: login, details and picker screens, then a console. Left pane picks state, city, hospital. Right pane has module tabs. */
:root{
  --bg:#E6F4EA; --surface:#F6FCF8; --ink:#0E2A1B; --muted:#4A6B58; --line:#BCDCC6;
  --accent:#1E8A4D; --accent-ink:#FFFFFF; --alert:#C8312B; --alert-ink:#FFFFFF; --ok:#1E7A46; --warn:#A8620A; --tint:#D3EBDB;

  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1719; --surface:#112427; --ink:#E6F1F0; --muted:#94B0B2; --line:#223C40;
  --accent:#3FC1B8; --accent-ink:#052321; --alert:#FF6B63; --alert-ink:#2A0705; --ok:#5FD08A; --warn:#E8B04A; --tint:#163236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1719; --surface:#112427; --ink:#E6F1F0; --muted:#94B0B2; --line:#223C40;
  --accent:#3FC1B8; --accent-ink:#052321; --alert:#FF6B63; --alert-ink:#2A0705; --ok:#5FD08A; --warn:#E8B04A; --tint:#163236; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.bar{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=time],input[type=search]{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 10px;min-width:0}

/* intro screens */
#intro{min-height:100%;padding-block:16px 40px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 0 8px}
.hero svg{width:112px;height:112px}
.hero h1{font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:28px 0 20px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.how h3{font-size:17px;margin-bottom:6px}
.how p{margin:0;color:var(--muted);font-size:14px}
.notice{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;max-width:760px;margin:0 auto 24px}
.cta{display:flex;justify-content:center}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin:18px auto 0;text-align:left}
.form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.form input,.form select{width:100%;padding:11px 12px}
.form .note{font-size:12px;color:var(--muted);margin:0}
.ptitle{font-size:clamp(28px,5vw,40px);font-weight:800;margin-top:24px}
.err{color:var(--alert);font-size:13px;font-weight:600;margin:0;min-height:1.2em}
.form input[aria-invalid="true"]{border-color:var(--alert)}

/* console */
#dash{padding-bottom:40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin:0 -2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topin{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px}
.brand h2{font-size:24px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.banner{margin-top:14px;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.hlist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.hbtn{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;width:100%}
.hbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--tint)}
.hbtn b{font-weight:600}
.hbtn span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--alert);color:var(--alert-ink);font-size:11px;text-align:center}
.msg{min-height:0;margin:0 0 10px;font-size:14px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--alert)}
.sec{margin-top:20px}
.sec h3{font-size:18px;margin-bottom:8px}
.sub{color:var(--muted);margin:4px 0 12px;font-size:14px}
.amb{border:2px solid var(--alert);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.amb .num{font-family:var(--f-mono);font-size:clamp(24px,5vw,34px);font-weight:500;letter-spacing:.02em;word-break:break-word}
.amb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.call{background:var(--alert);color:var(--alert-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;text-decoration:none;font-size:14px;display:inline-block}
.none{border:2px dashed var(--line);border-radius:12px;padding:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.facts div{min-width:0}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;overflow-wrap:anywhere}
.alts{margin-top:10px;font-size:14px;color:var(--muted)}
.alts .mono,.mono{font-family:var(--f-mono)}
.alts .mono{color:var(--ink)}
.nat{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nat div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;min-width:0}
.nat b{font-family:var(--f-mono);font-size:22px;display:block}
.nat span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.tile b{font-family:var(--f-display);font-size:30px;font-weight:800;display:block;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--alert)}
.wardrow{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}

.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}

.sOcc{background:var(--accent)}.sCln{background:var(--warn)}.sMnt{background:var(--muted)}.sAvl{background:var(--tint)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.scroll{overflow-x:auto}

.tbl th{background:var(--tint);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;border:1px solid var(--line);margin:0 4px 2px 0;white-space:nowrap}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-bad{color:var(--alert);border-color:var(--alert)}.b-mute{color:var(--muted)}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inl label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bed{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);text-align:left;min-width:0}

.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.fine{font-size:12px;color:var(--muted);margin-top:14px}
.pn{display:flex;justify-content:space-between;gap:12px;margin:24px auto 0;max-width:380px;width:100%}
.pn .btn{flex:1}
.lock{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .8s}@keyframes fl{from{background:var(--tint)}to{background:var(--surface)}}}
</style>

function dkm(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dg=r(b[1]-a[1]);const q=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
let watchId=null,firstFix=true,mapPos=null;

      h("iframe",{id:"mapf",title:t("maptitle"),loading:"lazy",referrerpolicy:"no-referrer-when-downgrade",allow:"geolocation"}),
      h("p",{class:"fine",style:"margin:0"},t("mapnote")),
      h("div",{class:"row"},h("a",{class:"btn primary",id:"gm1",target:"_blank",rel:"noopener"},t("mapopen")),h("a",{class:"btn",id:"gm2",target:"_blank",rel:"noopener"},t("mapdir")))));

function updateMap(){

  if(!mapPos||dkm(mapPos,me)>0.025){mapPos=me.slice();$("mapf").src="https://maps.google.com/maps?q="+me[0]+","+me[1]+"&z=15&output=embed"}
  $("gm1").href=gmUrl(me);

  $("gm2").href=n?"https://www.google.com/maps/dir/?api=1&origin="+me[0]+","+me[1]+"&destination="+GEO[n.x.id][0]+","+GEO[n.x.id][1]+"&travelmode=driving":gmUrl(me)}
function askLoc(){
  if(!navigator.geolocation){locMsg=t("locno");locBad=true;renderNear();return}
  if(window.isSecureContext===false){locMsg=t("locsec");locBad=true;renderNear();return}
  locMsg=t("locwait");locBad=false;firstFix=true;renderNear();
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(p=>{
    me=[p.coords.latitude,p.coords.longitude];locMsg="";locBad=false;
    if(firstFix){firstFix=false;const n=nearestList()[0];if(n){state=n.x.state;city=n.x.city;hid=n.x.id;selBed=selDoc=selMed=null}renderAll();buildMap()}else renderNear();
    updateMap()},
    err=>{locMsg=t(err.code===1?"locdeny":"locoff");locBad=true;renderNear();closeMap()},
    {enableHighAccuracy:true,timeout:20000,maximumAge:5000})}
